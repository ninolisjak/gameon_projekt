name: GameOn CI/CD

on:
  push:
    branches: [main, master, yard-owner]
  pull_request:
    branches: [main, master, yard-owner]

# Če hitro zaporedoma pushneš dvakrat, prekini starejši tek.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  #Mmobilni testi
  test-mobile:
    name: Mobile testi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Instaliraj odvisnosti
        working-directory: ./mobile
        run: npm ci --legacy-peer-deps

      - name: Zaženi teste
        working-directory: ./mobile
        run: npm test -- --coverage --ci --forceExit

      - name: Naloži coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-coverage
          path: mobile/coverage/

  # testi web konzoe 
  test-web:
    name: Web testi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Instaliraj odvisnosti
        working-directory: ./web
        run: npm ci --legacy-peer-deps

      - name: Zaženi teste
        working-directory: ./web
        run: npm test -- --coverage --ci --forceExit

      - name: Naloži coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: web/coverage/

  # deployanje web konzole samo v mainu/masterju
  deploy-web:
    name: Deploy → Netlify
    runs-on: ubuntu-latest
    needs: [test-mobile, test-web]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/yard-owner')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Instaliraj odvisnosti
        working-directory: ./web
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: ./web
        run: npm run build
        #env:
        #  VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        #  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
        #  VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        #  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        #  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        #  VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Deploy na Netlify
        #uses: netlify/actions/cli@master
        #with:
        #  args: deploy --dir=web/dist --prod
        working-directory: ./web
        run: npx --yes netlify-cli@17 deploy --dir=dist --prod --message "CI deploy ${{ github.sha }}"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  # EAS build mobilne aplikacije (APK za demo) z  --no-wait: build se postavi v vrsto na Expo strežnikih, ter  job se ne zaustavi za 20+ minut čakanja.
  build-mobile:
    name: EAS build → APK
    runs-on: ubuntu-latest
    needs: [test-mobile, test-web]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/yard-owner')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Nastavi EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instaliraj odvisnosti
        working-directory: ./mobile
        run: npm ci --legacy-peer-deps

      - name: Postavi build v vrsto
        working-directory: ./mobile
        run: eas build --platform android --profile preview --non-interactive --no-wait
